server {
    listen 5000;

    server_name parser.local;
    error_log  /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;
    root /var/www/html;

    server_tokens off;

    # One job event per request, but package_facts for a large host can be several megabytes,
    # and nginx refuses anything over 1m by default.
    client_max_body_size 64m;

    location / {
        index parse.php;
    }
    location ~ /(LICENSE\.txt|composer\.lock|composer\.json|nginx\.conf|web\.config|htaccess\.txt|\.htaccess|\.gitignore|\.git) {
        return 404;
    }

    location ~ /\. {
        deny all;
        return 404;
    }

    # ^~ makes these win over the \.php$ location below.  Without it a regex location takes
    # precedence, and /vendor/*.php or /includes/*.php would be run directly.
    location ^~ /templates/ {
        return 404;
    }

    location ^~ /includes/ {
        return 404;
    }

    location ^~ /utility/ {
        return 404;
    }

    location ^~ /vendor/ {
        return 404;
    }

    rewrite  ^/(.+)$                        /parse.php break;

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }
}
