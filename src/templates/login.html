{% extends 'login_layout.html' %}
{% block body %}
			<form class="login" role="form" action="/" method="post">
				<div class="form-group mb-1">
					<label for="username">Email</label>
				</div>
				<div class="form-group mb-3">
					<input id="username" type="text" name="username" class="form-control form-control-sm border p-2 w-100" autocomplete="username" required>
				</div>
				<div class="form-group mb-1">
					<label for="password">Password</label>
				</div>
				<div class="form-group mb-3">
					<input id="password" type="password" name="password" class="form-control form-control-sm border p-2 w-100" autocomplete="current-password" required>
				</div><br>
				<div class="d-grid gap-2">
					<button type="submit" class="btn btn-primary btn-sm p-2 fw-bold fs-6">Log in</button>
				</div>
			</form>
			<div class="text-center mt-3">
				<a href="/forgot_password/" class="link-primary small">Forgot password?</a>
			</div>
{% endblock %}
